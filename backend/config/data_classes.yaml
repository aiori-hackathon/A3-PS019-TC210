

data_classes:
  Personal identity:
    sensitivity: High
    description: Name, date of birth, gender, age
    sub_types: [Name, Date of birth, Gender, Age]
  Contact information:
    sensitivity: Medium
    description: Email address, phone number
    sub_types: [Email address, Phone number]
  Government identifiers:
    sensitivity: Critical
    description: Aadhaar, PAN, passport, voter ID, driving licence numbers
    sub_types: [Aadhaar, PAN, Passport, Voter ID, Driving licence]
  Financial information:
    sensitivity: Critical
    description: Bank account number, IFSC, card number, UPI ID
    sub_types: [Bank account number, IFSC, Card number, UPI ID]
  Location / address:
    sensitivity: High
    description: Postal address, PIN code, geo-coordinates
    sub_types: [Postal address, PIN code, Geo-coordinates]
