
settings:
  sample_size: 30
  min_match_ratio: 0.3
  column_name_hints: true

rules:
  # ─── Personal identity ──────────────────────────────────────────────────────
  - id: PERSON
    name: Person Name
    entity: PERSON
    data_class: Personal identity
    engine: presidio
    algorithm: spaCy NER (en_core_web_lg) + plausibility check (no digits / masks)
    validator: person_name
    display_pattern: "NER: PERSON"
    context: []
    column_keywords: [name, firstname, lastname, surname, fullname]
    negative_column_keywords: [plan, product, item, city, state, country, district, category, status, type, brand, file, model, colour, color, sku, course, scheme, package, tier, street, area, locality, village, bank, branch]
    min_score: 0.5
    enabled: true

  - id: DATE_OF_BIRTH
    name: Date of Birth
    entity: DATE_OF_BIRTH
    data_class: Personal identity
    engine: regex
    algorithm: Regex (dd/mm/yyyy, yyyy-mm-dd, 12 Mar 1990) + real past date check; requires column context
    validator: date_of_birth
    patterns:
      - name: dob_dmy
        regex: "\\b(?:0?[1-9]|[12][0-9]|3[01])[-/.](?:0?[1-9]|1[0-2])[-/.](?:19|20)[0-9]{2}\\b"
        score: 0.3
      - name: dob_ymd
        regex: "\\b(?:19|20)[0-9]{2}[-/](?:0?[1-9]|1[0-2])[-/](?:0?[1-9]|[12][0-9]|3[01])\\b"
        score: 0.3
      - name: dob_text_month
        regex: "\\b(?:0?[1-9]|[12][0-9]|3[01])[\\s-](?:jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*,?[\\s-](?:19|20)[0-9]{2}\\b"
        score: 0.3
    context: [dob, birth, born, birthday, birthdate]
    column_keywords: [dob, birthdate, birthday, birth]
    negative_column_keywords: [created, updated, modified, timestamp, order, txn, transaction, invoice, due, expiry, expire, expires, valid, issue, issued, joining, joined, join, start, end, delivery, delivered, shipped, ship, booking, event, log, payment, paid, last, login, registration, registered, signup, renewal, maturity, policy]
    min_score: 0.5
    enabled: true

  - id: GENDER
    name: Gender
    entity: GENDER
    data_class: Personal identity
    engine: regex
    algorithm: Fixed word list (male, female, transgender, ...); single letters M/F need column context
    patterns:
      - name: gender_word
        regex: "^\\s*(?:male|female|transgender|trans(?:gender)?\\s?(?:man|woman)|non[-\\s]?binary|woman|man)\\s*$"
        score: 0.6
      - name: gender_short
        regex: "^\\s*(?:m|f|o|t|nb|other|others|prefer not to say)\\s*$"
        score: 0.3
    context: [gender, sex]
    column_keywords: [gender, sex]
    negative_column_keywords: [size, grade, class, section, shift, unit, plan, tier, rating]
    min_score: 0.5
    enabled: true

  - id: AGE
    name: Age
    entity: AGE
    data_class: Personal identity
    engine: regex
    algorithm: Whole number 0-120; requires column context
    validator: age
    patterns:
      - name: age_years
        regex: "^\\s*[0-9]{1,3}\\s*$"
        score: 0.3
    context: [age]
    column_keywords: [age]
    negative_column_keywords: [page, average, avg, usage, percentage, mileage, storage, package, image, stage, message, wage, voltage, dosage, coverage, language, leverage, damage, postage, qty, quantity, count, rating, score, stock]
    min_score: 0.5
    enabled: true

  # ─── Contact information ────────────────────────────────────────────────────
  - id: EMAIL_ADDRESS
    name: Email Address
    entity: EMAIL_ADDRESS
    data_class: Contact information
    engine: presidio
    algorithm: Presidio regex + TLD validation
    display_pattern: "[\\w.%+-]+@[\\w.-]+\\.[A-Za-z]{2,}"
    context: [email, mail]
    column_keywords: [email, mail]
    min_score: 0.5
    enabled: true

  - id: IN_PHONE_NUMBER
    name: Indian Mobile Number
    entity: IN_PHONE_NUMBER
    data_class: Contact information
    engine: regex
    algorithm: Regex (+91 / 0 prefix, 10 digits starting 6-9; 5-5 or 3-3-4 grouping)
    patterns:
      - name: in_mobile
        regex: "(?<![0-9])(?:\\+91[\\s-]?|0)?[6-9][0-9]{4}[\\s-]?[0-9]{5}(?![0-9])"
        score: 0.85
      - name: in_mobile_3_3_4
        regex: "(?<![0-9])(?:\\+91[\\s-]?|0)?[6-9][0-9]{2}[\\s-][0-9]{3}[\\s-][0-9]{4}(?![0-9])"
        score: 0.85
    context: [phone, mobile, contact, cell, tel]
    column_keywords: [phone, mobile, cell, telephone, msisdn]
    negative_column_keywords: [order, invoice, inv, txn, transaction, sku, serial, tracking, ticket, awb, barcode, isbn, imei, voucher, coupon, receipt, booking, pnr, batch, lot, account, acct, iban]
    min_score: 0.5
    enabled: true

  - id: PHONE_NUMBER
    name: International Phone Number
    entity: PHONE_NUMBER
    data_class: Contact information
    engine: presidio
    algorithm: Presidio + libphonenumber validation
    display_pattern: "libphonenumber"
    context: [phone, mobile, contact, cell, tel]
    column_keywords: []
    negative_column_keywords: [order, invoice, inv, txn, transaction, sku, serial, tracking, ticket, awb, barcode, isbn, imei, voucher, coupon, receipt, booking, pnr, batch, lot, account, acct, iban]
    min_score: 0.5
    enabled: true

  # ─── Government identifiers ─────────────────────────────────────────────────
  - id: IN_AADHAAR
    name: Aadhaar Number
    entity: IN_AADHAAR
    data_class: Government identifiers
    engine: regex
    algorithm: Regex (12 digits, 4-4-4 grouping) + Verhoeff checksum + context
    validator: aadhaar     # matches failing the Verhoeff check digit are discarded
    patterns:
      - name: aadhaar_grouped
        regex: "\\b[2-9][0-9]{3}[\\s-][0-9]{4}[\\s-][0-9]{4}\\b"
        score: 0.85
      - name: aadhaar_plain
        regex: "\\b[2-9][0-9]{11}\\b"
        score: 0.3
    context: [aadhaar, aadhar, uidai, uid]
    column_keywords: [aadhaar, aadhar, uidai]
    negative_column_keywords: [invoice, inv, order, txn, transaction, serial, tracking, ticket, barcode, isbn, imei, receipt, booking, pnr, batch]
    min_score: 0.5
    enabled: true

  - id: IN_PAN
    name: PAN Card Number
    entity: IN_PAN
    data_class: Government identifiers
    engine: regex
    algorithm: Regex (AAAAA9999A) + holder-type check (4th letter P/C/H/F/A/T/B/L/J/G)
    validator: pan
    patterns:
      - name: pan
        regex: "\\b[A-Z]{5}[0-9]{4}[A-Z]\\b"
        score: 0.85
    context: [pan, tax, income, permanent]
    column_keywords: [pan]
    negative_column_keywords: [sku, product, item, part, model, serial, batch, lot, voucher, coupon, promo, order, invoice, booking, pnr, ticket, code]
    min_score: 0.5
    enabled: true

  - id: IN_PASSPORT
    name: Indian Passport Number
    entity: IN_PASSPORT
    data_class: Government identifiers
    engine: regex
    algorithm: Regex (1 letter + 7 digits, e.g. A1234567); no checksum, requires column context
    patterns:
      - name: passport
        regex: "\\b[A-PR-WY][1-9][0-9]\\s?[0-9]{4}[1-9]\\b"
        score: 0.4
    context: [passport]
    column_keywords: [passport]
    negative_column_keywords: [order, invoice, ticket, booking, pnr, sku, product, txn, ref, serial, coupon, voucher, awb, tracking, batch, lot, employee, emp, roll, member, policy, claim, model]
    min_score: 0.5
    enabled: true

  - id: IN_VOTER_ID
    name: Voter ID (EPIC) Number
    entity: IN_VOTER_ID
    data_class: Government identifiers
    engine: regex
    algorithm: Regex (3 letters + 7 digits, e.g. ABC1234567); no checksum
    patterns:
      - name: epic
        regex: "\\b[A-Z]{3}[0-9]{7}\\b"
        score: 0.5
    context: [voter, epic, election, electoral]
    column_keywords: [voter, epic]
    negative_column_keywords: [order, invoice, ticket, booking, pnr, sku, product, txn, ref, serial, coupon, voucher, awb, tracking, batch, lot, employee, emp, roll, member, policy, claim, model]
    min_score: 0.5
    enabled: true

  - id: IN_DRIVING_LICENCE
    name: Driving Licence Number
    entity: IN_DRIVING_LICENCE
    data_class: Government identifiers
    engine: regex
    algorithm: Regex (state code + RTO + year + 7 digits) + state-code and issue-year check
    validator: driving_licence
    patterns:
      - name: driving_licence
        regex: "\\b[A-Z]{2}[-\\s]?[0-9]{2}[-\\s]?(?:19|20)[0-9]{2}[-\\s]?[0-9]{7}\\b"
        score: 0.75
    context: [licence, license, driving, dl]
    column_keywords: [licence, license, dl]
    negative_column_keywords: [order, invoice, ticket, booking, sku, product, serial, tracking, vehicle, registration]
    min_score: 0.5
    enabled: true

  # ─── Financial information ──────────────────────────────────────────────────
  - id: CREDIT_CARD
    name: Credit / Debit Card Number
    entity: CREDIT_CARD
    data_class: Financial information
    engine: presidio
    algorithm: Presidio regex + Luhn checksum
    display_pattern: "[0-9]{13,19} (Luhn-valid)"
    context: [card, credit, debit, visa, mastercard]
    column_keywords: [card]
    negative_column_keywords: [order, invoice, sku, serial, tracking, awb, barcode, isbn, imei, ticket, ref, reference, booking, pnr, receipt]
    min_score: 0.5
    enabled: true

  - id: IN_RUPAY_CARD
    name: RuPay Card Number
    entity: IN_RUPAY_CARD
    data_class: Financial information
    engine: regex
    algorithm: Regex (RuPay prefixes 60/65/81/82/508) + Luhn checksum
    validator: luhn
    patterns:
      - name: rupay
        regex: "\\b(?:508[5-9]|60[0-9]{2}|65[0-9]{2}|81[0-9]{2}|82[0-9]{2})(?:[\\s-]?[0-9]{4}){3}\\b"
        score: 0.85
    context: [card, rupay, debit, credit]
    column_keywords: [card, rupay]
    negative_column_keywords: [order, invoice, sku, serial, tracking, awb, barcode, isbn, imei, ticket, ref, reference, booking, pnr, receipt]
    min_score: 0.5
    enabled: true

  - id: MASKED_CARD
    name: Masked Card Number
    entity: MASKED_CARD
    data_class: Financial information
    engine: regex
    algorithm: Regex (masked card, last 4 digits visible)
    patterns:
      - name: masked_card
        regex: "(?<![0-9A-Za-z])(?:[Xx*•]{4}[\\s-]?){3}[0-9]{4}(?![0-9])"
        score: 0.85
    context: [card, credit, debit]
    column_keywords: []
    min_score: 0.5
    enabled: true

  - id: IN_BANK_ACCOUNT
    name: Bank Account Number
    entity: IN_BANK_ACCOUNT
    data_class: Financial information
    engine: regex
    algorithm: Weak regex (9-18 digits), requires column context
    patterns:
      - name: bank_account
        regex: "\\b[0-9]{9,18}\\b"
        score: 0.3
    context: [account, acct, bank, savings, iban]
    column_keywords: [account, acct, iban]
    negative_column_keywords: [order, invoice, sku, serial, tracking, awb, barcode, isbn, imei, id, type, status, balance, opened, pnr, mobile, phone, contact]
    min_score: 0.5
    enabled: true

  - id: IN_IFSC
    name: IFSC Code
    entity: IN_IFSC
    data_class: Financial information
    engine: regex
    algorithm: Regex (4 letters + 0 + 6 alphanumerics, e.g. SBIN0001234)
    patterns:
      - name: ifsc
        regex: "\\b[A-Z]{4}0[A-Z0-9]{6}\\b"
        score: 0.75
    context: [ifsc, branch, bank, neft, rtgs]
    column_keywords: [ifsc]
    negative_column_keywords: [sku, product, warehouse, item, part, batch, lot, serial, model, coupon, voucher, order, invoice]
    min_score: 0.5
    enabled: true

  - id: UPI_ID
    name: UPI ID (VPA)
    entity: UPI_ID
    data_class: Financial information
    engine: regex
    algorithm: Regex (name@handle, no dot after @); known bank handles score higher than unknown ones
    patterns:
      - name: upi_known_handle
        regex: "(?<![\\w.@-])[a-z0-9][a-z0-9._-]{1,254}@(?:okaxis|okicici|oksbi|okhdfcbank|okbizaxis|ybl|ibl|axl|paytm|ptyes|ptsbi|pthdfc|ptaxis|apl|yapl|upi|airtel|jio|freecharge|axisbank|axisb|icici|sbi|hdfcbank|kotak|kmbl|barodampay|pnb|unionbank|ubi|yesbank|yesbankltd|idfcbank|idfcfirst|indus|federal|fbl|rbl|kbl|aubank|dbs|hsbc|citi|boi|cnrb|centralbank|uco|mahb|ikwik|waaxis|wahdfcbank|wasbi|waicici|pingpay|nsdl|abfspay|naviaxis|superyes|postbank|equitas|jupiteraxis|fam|slc|tapicici|indianbank|iob|psb|idbi|jkb|kvb|sib|dcb)(?![\\w.@-])"
        score: 0.85
      - name: upi_any_handle
        regex: "(?<![\\w.@-])[a-z0-9][a-z0-9._-]{1,254}@[a-z][a-z0-9]{1,63}(?![\\w.@-])"
        score: 0.4
    context: [upi, vpa, payee, payment]
    column_keywords: [upi, vpa]
    min_score: 0.5
    enabled: true

  # ─── Location / address ─────────────────────────────────────────────────────
  - id: POSTAL_ADDRESS
    name: Postal Address
    entity: POSTAL_ADDRESS
    data_class: Location / address
    engine: regex
    algorithm: Address words (flat, road, nagar, sector, ...) or a trailing PIN code + a number + at least 3 words
    validator: address
    patterns:
      - name: address
        regex: "^(?=.*[0-9])(?=.*\\b(?:flat|house|h\\.?\\s?no|plot|door|apartment|apartments|apt|floor|block|sector|street|road|rd|lane|marg|path|nagar|colony|layout|cross|circle|enclave|vihar|society|tower|building|bldg|near|opp|opposite|chowk|bazaar|bazar|gali|galli|mohalla|phase|ward|village|zila|taluk|tehsil|district|residency|complex|extension|bagh|puram|pura|ganj|wadi|peth)\\b).{10,250}$"
        score: 0.6
      - name: address_ending_in_pin
        regex: "^(?=.*[A-Za-z]{3,}.*[A-Za-z]{3,}).{6,240}[\\s,-][1-9][0-9]{2}\\s?[0-9]{3}\\s*$"
        score: 0.6
    context: [address, addr, street, residence, residential, postal, mailing]
    column_keywords: [address, addr]
    negative_column_keywords: [email, ip, mac, wallet, web, url, server, host, message, comment, note, notes, description, remark, remarks, log]
    min_score: 0.5
    enabled: true

  - id: IN_PIN_CODE
    name: PIN Code
    entity: IN_PIN_CODE
    data_class: Location / address
    engine: regex
    algorithm: Regex (6 digits, first digit 1-9); requires column context
    patterns:
      - name: pin_code
        regex: "\\b[1-9][0-9]{5}\\b"
        score: 0.3
      - name: pin_code_spaced
        regex: "\\b[1-9][0-9]{2}\\s[0-9]{3}\\b"
        score: 0.3
    context: [pincode, pin, postal, postcode, zip]
    column_keywords: [pincode, pin, postcode, zipcode, zip]
    negative_column_keywords: [otp, mpin, atm, passcode, password, sku, product, order, invoice, employee, emp, batch, ticket, txn, ref]
    min_score: 0.5
    enabled: true

  - id: GEO_COORDINATES
    name: Geo-coordinates
    entity: GEO_COORDINATES
    data_class: Location / address
    engine: regex
    algorithm: "Regex (lat, lon with 4+ decimals) + range check; a single lat or lon value needs column context"
    validator: coordinates
    patterns:
      - name: lat_lon_pair
        regex: "(?<![0-9.])[-+]?[0-9]{1,2}\\.[0-9]{4,}\\s*,\\s*[-+]?[0-9]{1,3}\\.[0-9]{4,}(?![0-9.])"
        score: 0.85
      - name: single_coordinate
        regex: "^\\s*[-+]?[0-9]{1,3}\\.[0-9]{4,}\\s*$"
        score: 0.3
    context: [latitude, longitude, lat, lng, lon, geo, coord, gps, location]
    column_keywords: [latitude, longitude, lat, lng, lon, coordinates, geo, gps, latlong, latlng]
    negative_column_keywords: [price, amount, total, balance, rate, score, weight, height, temperature, temp, distance, ratio, pct, percent, salary, fee, cost, tax, discount, interest]
    min_score: 0.5
    enabled: true
